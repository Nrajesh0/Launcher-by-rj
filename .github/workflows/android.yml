name: Android build and release
on:
  push:
    branches: [main, rebuild-v4]
    tags: ['v*']
    paths-ignore: ['release-assets/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for the Android build and emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sdkmanager 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.1.0'
      - name: Compile and inspect replacement engine
        env:
          DOT_BUILD_TYPE: Release
        run: |
          bash scripts/test.sh
          bash build.sh --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: dot-home-4.0.0
          path: |
            build/dot-home-4.0.0-unsigned.apk
            build/dot-home-4.0.0-unsigned.apk.sha256
          if-no-files-found: error
      - name: Build independent instrumentation
        run: |
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.1.0" bash scripts/build_ui_test.sh
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.p12" -alias smoke -storepass android -keypass android -keyalg RSA -validity 2 -dname 'CN=Disposable foundation test' -noprompt
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:android --out build/ui-test/app.apk build/dot-home-4.0.0-unsigned.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:android --out build/ui-test/tests.apk build/ui-test/aligned.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign --ks "$RUNNER_TEMP/test.p12" --ks-pass pass:android --out build/ui-test/previous.apk release-assets/v3.0.0/dot-home-3.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-bundle-4.0.0
          path: |
            build/ui-test/app.apk
            build/ui-test/tests.apk
            build/ui-test/previous.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable test key
        if: always()
        run: rm -f "$RUNNER_TEMP/test.p12"
  ui-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for the test device
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          free -m
          df -h "$GITHUB_WORKSPACE"
          for entry in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
            if [ -r "$entry" ]; then echo "$entry"; cat "$entry"; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: emulator-bundle-4.0.0
          path: build/ui-test
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache Android 16 system image
        id: emulator-image
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-36/google_apis/x86_64
          key: foundation-android36-google-apis-x86_64-v1
      - name: Install and verify emulator image
        id: install-image
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if timeout 480s sdkmanager 'system-images;android-36;google_apis;x86_64' && test -s "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/system.img"; then
              exit 0
            fi
            echo "System image installation attempt $attempt failed; retrying the SDK download."
            if [ -d "$ANDROID_HOME/.temp" ]; then rm -rf "$ANDROID_HOME/.temp"; fi
          done
          exit 1
      - name: Save verified system image
        if: steps.emulator-image.outputs.cache-hit != 'true' && steps.install-image.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-36/google_apis/x86_64
          key: foundation-android36-google-apis-x86_64-v1
      - name: Exercise native launcher interactions
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-build: 15507667 # Android Emulator 36.6.11 stable, from the official archive
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none -skin 720x1600 -prop qemu.sf.lcd_density=280
          script: |
            adb shell settings put global device_provisioned 1
            adb shell settings put secure user_setup_complete 1
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            adb shell wm density 280
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb logcat -c
            adb install -r --no-incremental build/ui-test/app.apk
            adb install -r --no-incremental build/ui-test/tests.apk
            nohup adb logcat -v threadtime -s AndroidRuntime ActivityManager ActivityTaskManager libc art Zygote DotMigration DotFoundation AppWidgetHostView > build/ui-test/runtime-live.txt 2>&1 < /dev/null &
            nohup bash tests/android/watch_screenshots.sh > build/ui-test/capture-status.txt 2>&1 < /dev/null &
            timeout 240s adb shell am instrument -w dev.dothome.test/dev.dothome.test.FoundationSmoke > build/ui-test/foundation-result.txt || echo RUNNER_ERROR_OR_TIMEOUT >> build/ui-test/foundation-result.txt
            cat build/ui-test/foundation-result.txt
            adb logcat -d -s AndroidRuntime DotMigration CustomWidgetManager DotFoundation LoaderTask WorkspaceItemProcessor WidgetInflater LauncherModel AppWidgetHostView LauncherAppWidgetHostView > build/ui-test/foundation-runtime.txt
            adb pull /sdcard/Download build/ui-test/foundation-screenshots
            grep -q 'PASS: foundation' build/ui-test/foundation-result.txt
            ! grep -q 'FATAL EXCEPTION' build/ui-test/foundation-runtime.txt
            adb uninstall dev.dothome
            adb install --no-incremental build/ui-test/previous.apk
            adb install -r --no-incremental build/ui-test/tests.apk
            timeout 60s adb shell am instrument -w dev.dothome.test/dev.dothome.test.LegacySeed > build/ui-test/legacy-seed.txt
            adb logcat -d -s AndroidRuntime > build/ui-test/legacy-seed-runtime.txt
            cat build/ui-test/legacy-seed.txt
            grep -q 'PASS: synthetic' build/ui-test/legacy-seed.txt
            adb install -r --no-incremental build/ui-test/app.apk
            timeout 150s adb shell am instrument -w dev.dothome.test/dev.dothome.test.FoundationUpgrade > build/ui-test/upgrade-result.txt
            cat build/ui-test/upgrade-result.txt
            adb logcat -d -s AndroidRuntime DotMigration > build/ui-test/upgrade-runtime.txt
            adb pull /sdcard/Download/. build/ui-test/foundation-screenshots/
            grep -q 'PASS: v3-to-v4' build/ui-test/upgrade-result.txt
            ! grep -q 'FATAL EXCEPTION' build/ui-test/upgrade-runtime.txt
      - name: Diagnose runner failures
        if: always()
        run: |
          free -m
          df -h "$GITHUB_WORKSPACE"
          sudo dmesg --ctime | grep -Ei 'qemu|segfault|oom|killed process' | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: |
            build/ui-test/foundation-result.txt
            build/ui-test/foundation-runtime.txt
            build/ui-test/runtime-live.txt
            build/ui-test/capture-status.txt
            build/ui-test/upgrade-result.txt
            build/ui-test/upgrade-runtime.txt
            build/ui-test/legacy-seed.txt
            build/ui-test/legacy-seed-runtime.txt
            build/ui-test/foundation-screenshots
            build/foundation/build/reports/problems/problems-report.html
