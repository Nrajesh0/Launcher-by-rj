name: Android build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(python3 scripts/prepare_version.py)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Run model, migration and offline checks
        run: bash scripts/test.sh
      - name: Restore configured signing key
        id: signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          key = os.environ.get('SIGNING_KEY_BASE64', '')
          if not key:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('signed=false\n')
              print('Signing secrets are not configured; building an unsigned CI artifact.')
              raise SystemExit(0)
          path = Path(os.environ['RUNNER_TEMP']) / 'dot-home-signing.p12'
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('signed=true\n')
          PY
      - name: Build and verify signed offline APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/dot-home-signing.p12
          SIGNING_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ '${{ steps.signing.outputs.signed }}' == 'true' ]]; then
            bash build.sh
          else
            bash build.sh --unsigned
          fi
      - name: Upload versioned APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: dot-home-${{ steps.version.outputs.name }}
          path: |
            build/dot-home-${{ steps.version.outputs.name }}*.apk
            build/dot-home-${{ steps.version.outputs.name }}*.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dot-home-signing.p12"
  ui-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: dot-home-${{ needs.build.outputs.version }}
          path: build/download
      - name: Build instrumentation and sign emulator-only copies
        run: |
          bash scripts/build_ui_test.sh
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-only.p12" -alias smoke -storepass android -keypass android -keyalg RSA -validity 2 -dname 'CN=Ephemeral UI test' -noprompt
          apk=$(find build/download -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator-only.p12" --ks-pass pass:android --out build/ui-test/app.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator-only.p12" --ks-pass pass:android --out build/ui-test/tests.apk build/ui-test/aligned.apk
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 16 UI checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb install -r build/ui-test/app.apk
            adb install -r build/ui-test/tests.apk
            adb shell cmd package set-home-activity dev.dothome/.HomeActivity
            adb shell am force-stop com.android.launcher3
            adb shell screenrecord --time-limit 25 --bit-rate 2000000 /sdcard/Download/ui-motion.mp4 & recording_pid=$!; timeout 150s adb shell am instrument -w dev.dothome.test/dev.dothome.test.UiSmoke > build/ui-test/result.txt || echo RUNNER_ERROR_OR_TIMEOUT >> build/ui-test/result.txt; wait "$recording_pid" || true
            cat build/ui-test/result.txt
            adb logcat -d -s AndroidRuntime > build/ui-test/runtime.txt
            adb pull /sdcard/Download build/ui-test/screenshots
            grep -q 'PASS: home' build/ui-test/result.txt
            ! grep -q RUNNER_ERROR_OR_TIMEOUT build/ui-test/result.txt
            ! grep -q 'FATAL EXCEPTION' build/ui-test/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence-${{ needs.build.outputs.version }}
          path: |
            build/ui-test/result.txt
            build/ui-test/runtime.txt
            build/ui-test/screenshots
  release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dot-home-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Dot Home $RELEASE_VERSION" --generate-notes --notes 'Offline Android launcher. This APK requests no Internet permission. Download the APK and its SHA-256 checksum below.'
          fi
