name: Recover verified public v5 archive
on:
  push:
    branches: [v5-release-recovery]
    paths:
      - '.github/workflows/recover-public-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.1.0'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Recover only checksum-identical public archive tail and selected screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/recover_public_v5.py
      - name: Verify complete signed release against successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/verify_preview.py
      - name: Commit verified public artifacts to recovery branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-assets/v5.0.0/dot-home-5.0.0.apk.part066 docs/reference/v5-actual-review.jpg
          git commit -m "Recover exact verified public v5 archive tail and actual review sheet"
          git push origin HEAD:v5-release-recovery
