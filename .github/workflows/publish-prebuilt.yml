name: Publish locally signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.1.0'
      - name: Verify signed APK, source provenance and offline permission contract
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/verify_prebuilt.py
          version=$(python3 scripts/prepare_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish APK and checksum to the versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "release-assets/v$VERSION/dot-home-$VERSION.apk" "release-assets/v$VERSION/dot-home-$VERSION.apk.sha256" --clobber
          else
            gh release create "v$VERSION" "release-assets/v$VERSION/dot-home-$VERSION.apk" "release-assets/v$VERSION/dot-home-$VERSION.apk.sha256" --verify-tag --title "Dot Home $VERSION — Offline" --notes-file "release-assets/v$VERSION/NOTES.md"
          fi
